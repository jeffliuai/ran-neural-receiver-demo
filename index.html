<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAN DU-low: Neural Receiver Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>RAN DU-low: <span class="gradient-text" id="qam-title">16-QAM Receiver</span></h1>
            <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 5px;">
                <p style="margin: 0;">傳統數學模型 vs. 神經網路接收器</p>
                <a href="user_guide.html" target="_blank" class="guide-link">📖 使用說明 (PDF)</a>
            </div>
        </header>

        <main class="main-content">
            <div class="control-panel">
                <div class="panel-section">
                    <h2>發射端 (Transmitter)</h2>
                    <div class="qam-selection">
                        <label><input type="radio" name="qam-mode" value="16" checked> 16-QAM</label>
                        <label><input type="radio" name="qam-mode" value="64"> 64-QAM</label>
                    </div>
                    <p class="desc">選擇要傳送的符號。真實系統中，高功率放大器 (PA) 會造成外圍星座點的<strong>非線性壓縮與旋轉</strong>。</p>
                    
                    <div class="tx-grid" id="tx-grid">
                        <!-- Buttons 1-16 will be generated by JS -->
                    </div>

                    <div class="action-buttons">
                        <button id="btn-throw" class="btn primary-btn">
                            <span class="btn-icon">🎯</span> 單發測試
                        </button>
                        <button id="btn-throw-10" class="btn secondary-btn">
                            <span class="btn-icon">🚀</span> 連發 10 次看正確率
                        </button>
                    </div>
                    <div class="status-box">
                        <span class="label">目標傳送 (Tx):</span>
                        <span class="value tx-value" id="tx-value">6</span>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>接收端 (Receiver)</h2>
                    <p class="desc">選擇解碼模式。傳統模型使用死板的直線網格；神經網路能學到扭曲的網格來完美契合失真特徵。</p>
                    <div class="toggle-container">
                        <label class="switch">
                            <input type="checkbox" id="mode-toggle">
                            <span class="slider"></span>
                        </label>
                        <span id="mode-label" class="mode-label traditional">Traditional Model</span>
                    </div>
                    <div class="status-box result-box" id="result-box">
                        <span class="label">解碼結果 (Rx):</span>
                        <span class="value rx-value" id="rx-value">-</span>
                    </div>
                    <div id="result-message" class="result-message">點擊上方按鈕開始發射訊號！</div>
                    
                    <div class="stats-box" id="stats-box" style="display: none;">
                        <h3>📊 10 連發正確率統計</h3>
                        <div class="stat-row">
                            <span>傳統模型正確率：</span>
                            <span id="stat-trad" class="stat-val traditional-color">0%</span>
                        </div>
                        <div class="stat-row">
                            <span>神經網路正確率：</span>
                            <span id="stat-neural" class="stat-val neural-color">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="visualization-area">
                <div class="dartboard-container">
                    <svg id="dartboard" viewBox="-120 -120 240 240" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            <radialGradient id="heatmap-grad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="rgba(255, 0, 127, 0.4)" />
                                <stop offset="100%" stop-color="rgba(255, 0, 127, 0)" />
                            </radialGradient>
                        </defs>
                        
                        <!-- Heatmap Overlay (for Neural) -->
                        <g id="heatmap-layer" style="opacity: 0;"></g>

                        <!-- Groups for JS to populate -->
                        <g id="traditional-boundaries"></g>
                        <g id="neural-boundaries" style="opacity: 0;"></g>
                        
                        <!-- The 16 ideal points -->
                        <g id="ideal-points"></g>
                        <g id="labels"></g>
                        
                        <!-- Darts -->
                        <g id="darts"></g>
                    </svg>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js?v=2"></script>
</body>
</html>
